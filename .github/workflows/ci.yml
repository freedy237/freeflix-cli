name: CI

# Lint + tests on every push and PR, on Linux AND Windows, so regressions
# (e.g. the Windows arrow-key breakage) are caught before release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin 22.04: ubuntu-latest moved to 26.04, where setup-python no
        # longer provides 3.9. Keep Ubuntu 22.04 for the oldest supported
        # Python so the compatibility job stays meaningful.
        os: [ubuntu-22.04, windows-latest]
        python-version: ['3.9', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Ruff (real-bug checks)
        run: uvx ruff check --select E,W,F,B --ignore E501,E402 src/freeflix_cli/

      - name: Import every module
        run: >
          uv run --with . python -c "import pkgutil,importlib,freeflix_cli;
          [importlib.import_module(m.name) for m in
          pkgutil.walk_packages(freeflix_cli.__path__,'freeflix_cli.')];
          print('all modules import OK')"

      - name: Pytest (+ coverage ratchet)
        # Coverage is a REGRESSION ratchet, not a quality gate: the floor is set
        # near today's level so a PR that drops coverage fails, while the (large,
        # hard-to-test TUI/scraper) untested surface doesn't block the build.
        # Raise --cov-fail-under over time as more tests land.
        run: >
          uv run --with . --with pytest --with pytest-cov -m pytest -q
          --cov=freeflix_cli --cov-report=term-missing --cov-fail-under=15
